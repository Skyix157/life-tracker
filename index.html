<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Life Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="menubar">
    <span class="menubar-app">✦ Life Tracker</span>
    <span class="menubar-page" id="menubar-page"></span>
    <span class="spacer"></span>
    <span id="clock"></span>
  </header>

  <div class="window">
    <aside class="sidebar">
      <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>

      <div class="side-header">Planner</div>
      <nav id="tabs">
        <a href="#/daily" data-page="daily">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6"/><path d="M10 2.2v2M10 15.8v2M2.2 10h2M15.8 10h2M4.5 4.5l1.4 1.4M14.1 14.1l1.4 1.4M4.5 15.5l1.4-1.4M14.1 5.9l1.4-1.4"/></svg>
          Daily
        </a>
        <a href="#/weekly" data-page="weekly">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="14" rx="3"/><path d="M2.5 7.5h15M7.5 7.5v10M12.5 7.5v10M6.5 2v3M13.5 2v3"/></svg>
          Weekly
        </a>
        <a href="#/monthly" data-page="monthly">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="14" rx="3"/><path d="M2.5 7.5h15M6.5 2v3M13.5 2v3"/><circle cx="6.5" cy="11" r=".6"/><circle cx="10" cy="11" r=".6"/><circle cx="13.5" cy="11" r=".6"/><circle cx="6.5" cy="14.2" r=".6"/><circle cx="10" cy="14.2" r=".6"/></svg>
          Monthly
        </a>
        <a href="#/overview" data-page="overview">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="2.5" width="6.5" height="6.5" rx="2"/><rect x="11" y="2.5" width="6.5" height="6.5" rx="2"/><rect x="2.5" y="11" width="6.5" height="6.5" rx="2"/><rect x="11" y="11" width="6.5" height="6.5" rx="2"/></svg>
          Overview
        </a>
      </nav>

      <div class="side-header">Backup</div>
      <div class="side-actions">
        <button id="export">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 12.5V2.5M6.5 6 10 2.5 13.5 6M5 9H4a1.5 1.5 0 0 0-1.5 1.5v5A1.5 1.5 0 0 0 4 17h12a1.5 1.5 0 0 0 1.5-1.5v-5A1.5 1.5 0 0 0 16 9h-1"/></svg>
          Export backup
        </button>
        <label>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5v10M6.5 9 10 12.5 13.5 9M5 9H4a1.5 1.5 0 0 0-1.5 1.5v5A1.5 1.5 0 0 0 4 17h12a1.5 1.5 0 0 0 1.5-1.5v-5A1.5 1.5 0 0 0 16 9h-1"/></svg>
          Import backup
          <input id="import" type="file" accept="application/json" hidden>
        </label>
      </div>
      <p class="side-note"><span id="import-status"></span><span>Saved in this browser only.</span></p>
    </aside>

    <main id="view" class="view"></main>
  </div>

  <dialog id="event-dialog">
    <form id="event-form">
      <h3 id="event-dialog-title">Add schedule</h3>
      <label>Title <input name="title" required maxlength="80" placeholder="e.g. Physics midterm"></label>
      <div class="row3">
        <label>Date <input name="date" type="date" required></label>
        <label>Start <input name="start" type="time" required></label>
        <label>End <input name="end" type="time"></label>
      </div>
      <fieldset class="type-pick" id="event-types"><legend>Type</legend></fieldset>
      <div class="dialog-actions">
        <button type="button" id="event-delete" class="ghost danger">Delete</button>
        <span class="spacer"></span>
        <button type="button" id="event-cancel" class="ghost">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="js/store.js"></script>
  <script src="js/daily.js"></script>
  <script src="js/weekly.js"></script>
  <script src="js/monthly.js"></script>
  <script src="js/overview.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
