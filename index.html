<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Life Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Life Tracker</h1>
    <p id="today"></p>
  </header>

  <main>
    <section class="card">
      <h2>Habits</h2>
      <form id="habit-form">
        <input id="habit-name" placeholder="New habit, e.g. Read 20 min" maxlength="60" required>
        <button type="submit">Add</button>
      </form>
      <div class="table-wrap">
        <table id="habit-table">
          <thead><tr id="habit-head"></tr></thead>
          <tbody id="habit-body"></tbody>
        </table>
      </div>
      <p id="habit-empty" class="muted">No habits yet. Add one above.</p>
    </section>

    <section class="card">
      <h2>Today's check-in</h2>
      <form id="log-form">
        <label>Mood
          <select id="mood">
            <option value="">–</option>
            <option value="1">1 · rough</option>
            <option value="2">2 · meh</option>
            <option value="3">3 · okay</option>
            <option value="4">4 · good</option>
            <option value="5">5 · great</option>
          </select>
        </label>
        <label>Sleep (hours)
          <input id="sleep" type="number" min="0" max="24" step="0.5">
        </label>
        <label class="full">Notes
          <textarea id="notes" rows="3" placeholder="How did today go?"></textarea>
        </label>
        <button type="submit">Save</button>
        <span id="saved" class="muted"></span>
      </form>
    </section>

    <section class="card">
      <h2>Recent days</h2>
      <ul id="history"></ul>
    </section>

    <section class="card actions">
      <button id="export">Export data</button>
      <label class="button">Import data<input id="import" type="file" accept="application/json" hidden></label>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
